<aside
  :class="sidebarToggle ? 'translate-x-0 xl:w-22.5' : '-translate-x-full'"
  class="sidebar fixed top-0 left-0 z-9999 flex h-screen w-72.5 flex-col overflow-y-auto border-r border-gray-200 bg-white px-5 transition-all duration-300 xl:static xl:translate-x-0 dark:border-gray-800 dark:bg-black"
  @click.outside="if (window.innerWidth < 1280) sidebarToggle = false"
>
  <!-- Logo -->
  <div
    :class="sidebarToggle ? 'justify-center' : 'justify-between'"
    class="sidebar-header flex items-center gap-2 pt-8 pb-7"
  >
    <a href="/" class="flex items-center gap-3">
      <span
        class="bg-brand-500 flex size-10 shrink-0 items-center justify-center rounded-xl text-white"
        aria-hidden="true"
      >
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" class="fill-current">
          <path
            d="M4.5 3.75h15a.75.75 0 0 1 .72.53l1.2 3.9A2.85 2.85 0 0 1 18.9 11.1a2.85 2.85 0 0 1-2.4-1.3 2.85 2.85 0 0 1-4.5 0 2.85 2.85 0 0 1-4.5 0 2.85 2.85 0 0 1-5.22-2.62l1.2-3.9a.75.75 0 0 1 .72-.53Zm.42 8.45v6.55c0 .83.67 1.5 1.5 1.5h3.33v-4.6h4.5v4.6h3.33c.83 0 1.5-.67 1.5-1.5V12.2a4.35 4.35 0 0 1-4.5-.86 4.35 4.35 0 0 1-4.5 0 4.35 4.35 0 0 1-5.16.86Z"
          />
        </svg>
      </span>
      <span class="logo leading-tight" :class="sidebarToggle ? 'hidden' : ''">
        <span
          class="block text-base font-semibold text-gray-800 dark:text-white/90"
          x-text="app ? app.event.nama : 'Imperfect Sale'"
        ></span>
        <span class="block text-xs text-gray-500 dark:text-gray-400">
          Dashboard Penjualan
        </span>
      </span>
    </a>
  </div>

  <div class="no-scrollbar flex flex-1 flex-col overflow-y-auto duration-300 ease-linear">
    <nav>
      <div>
        <h3 class="mb-4 text-xs leading-5 text-gray-400 uppercase">
          <span class="menu-group-title" :class="sidebarToggle ? 'xl:hidden' : ''">Menu</span>
          <span
            :class="sidebarToggle ? 'lg:block hidden' : 'hidden'"
            class="menu-group-icon mx-auto block text-center"
            aria-hidden="true"
            >&middot;&middot;&middot;</span
          >
        </h3>

        <ul class="mb-6 flex flex-col gap-1">
          <li>
            <a
              href="/ringkasan"
              class="menu-item group"
              :class="page === 'ringkasan' ? 'menu-item-active' : 'menu-item-inactive'"
            >
              <svg
                class="shrink-0"
                :class="page === 'ringkasan' ? 'menu-item-icon-active' : 'menu-item-icon-inactive'"
                width="24" height="24" viewBox="0 0 24 24" fill="none"
              >
                <path
                  fill-rule="evenodd" clip-rule="evenodd"
                  d="M12 2.75a.75.75 0 0 1 .75.75v7.75h7.75a.75.75 0 0 1 .75.75A9.25 9.25 0 1 1 12 2.75Zm-.75 1.54a7.75 7.75 0 1 0 8.46 8.46H12a.75.75 0 0 1-.75-.75V4.29Zm3-1.29a.75.75 0 0 1 .82-.67 7.75 7.75 0 0 1 6.85 6.85.75.75 0 0 1-.67.82h-6.25a.75.75 0 0 1-.75-.75V3Zm1.5.87v4.63h4.63a6.26 6.26 0 0 0-4.63-4.63Z"
                  fill="currentColor"
                />
              </svg>
              <span class="menu-item-text" :class="sidebarToggle ? 'xl:hidden' : ''">Ringkasan All</span>
            </a>
          </li>

          <li>
            <a
              href="/"
              class="menu-item group"
              :class="page === 'pivot' ? 'menu-item-active' : 'menu-item-inactive'"
            >
              <svg
                class="shrink-0"
                :class="page === 'pivot' ? 'menu-item-icon-active' : 'menu-item-icon-inactive'"
                width="24" height="24" viewBox="0 0 24 24" fill="none"
              >
                <path
                  fill-rule="evenodd" clip-rule="evenodd"
                  d="M5.5 3.25A2.25 2.25 0 0 0 3.25 5.5V9a2.25 2.25 0 0 0 2.25 2.25H9A2.25 2.25 0 0 0 11.25 9V5.5A2.25 2.25 0 0 0 9 3.25H5.5Zm-.75 2.25a.75.75 0 0 1 .75-.75H9a.75.75 0 0 1 .75.75V9a.75.75 0 0 1-.75.75H5.5A.75.75 0 0 1 4.75 9V5.5Zm.75 7.25A2.25 2.25 0 0 0 3.25 15v3.5a2.25 2.25 0 0 0 2.25 2.25H9a2.25 2.25 0 0 0 2.25-2.25V15A2.25 2.25 0 0 0 9 12.75H5.5ZM4.75 15a.75.75 0 0 1 .75-.75H9a.75.75 0 0 1 .75.75v3.5a.75.75 0 0 1-.75.75H5.5a.75.75 0 0 1-.75-.75V15Zm8-9.5A2.25 2.25 0 0 1 15 3.25h3.5a2.25 2.25 0 0 1 2.25 2.25V9a2.25 2.25 0 0 1-2.25 2.25H15A2.25 2.25 0 0 1 12.75 9V5.5ZM15 4.75a.75.75 0 0 0-.75.75V9c0 .414.336.75.75.75h3.5A.75.75 0 0 0 19.25 9V5.5a.75.75 0 0 0-.75-.75H15Zm0 8A2.25 2.25 0 0 0 12.75 15v3.5A2.25 2.25 0 0 0 15 20.75h3.5a2.25 2.25 0 0 0 2.25-2.25V15a2.25 2.25 0 0 0-2.25-2.25H15ZM14.25 15a.75.75 0 0 1 .75-.75h3.5a.75.75 0 0 1 .75.75v3.5a.75.75 0 0 1-.75.75H15a.75.75 0 0 1-.75-.75V15Z"
                  fill="currentColor"
                />
              </svg>
              <span class="menu-item-text" :class="sidebarToggle ? 'xl:hidden' : ''">Sesi × Channel</span>
            </a>
          </li>

          <li>
            <a
              href="/transactions"
              class="menu-item group"
              :class="page === 'transactions' ? 'menu-item-active' : 'menu-item-inactive'"
            >
              <svg
                class="shrink-0"
                :class="page === 'transactions' ? 'menu-item-icon-active' : 'menu-item-icon-inactive'"
                width="24" height="24" viewBox="0 0 24 24" fill="none"
              >
                <path
                  fill-rule="evenodd" clip-rule="evenodd"
                  d="M6.25 2.75A2.25 2.25 0 0 0 4 5v14a2.25 2.25 0 0 0 2.25 2.25h11.5A2.25 2.25 0 0 0 20 19V8.56a2.25 2.25 0 0 0-.66-1.59l-3.81-3.81a2.25 2.25 0 0 0-1.59-.66H6.25Zm-.75 2.5a.75.75 0 0 1 .75-.75h7.25v3.19c0 .58.47 1.06 1.06 1.06h3.94V19a.75.75 0 0 1-.75.75H6.25A.75.75 0 0 1 5.5 19V5.25ZM7.75 11a.75.75 0 0 1 .75-.75h7a.75.75 0 0 1 0 1.5h-7a.75.75 0 0 1-.75-.75Zm.75 2.75a.75.75 0 0 0 0 1.5h7a.75.75 0 0 0 0-1.5h-7Zm0 3.5a.75.75 0 0 0 0 1.5h4a.75.75 0 0 0 0-1.5h-4Z"
                  fill="currentColor"
                />
              </svg>
              <span class="menu-item-text" :class="sidebarToggle ? 'xl:hidden' : ''">Rincian Transaksi</span>
            </a>
          </li>

          <li>
            <a
              href="/eksternal"
              class="menu-item group"
              :class="page === 'eksternal' ? 'menu-item-active' : 'menu-item-inactive'"
            >
              <svg
                class="shrink-0"
                :class="page === 'eksternal' ? 'menu-item-icon-active' : 'menu-item-icon-inactive'"
                width="24" height="24" viewBox="0 0 24 24" fill="none"
              >
                <path
                  fill-rule="evenodd" clip-rule="evenodd"
                  d="M11.65 2.33a.75.75 0 0 1 .7 0l8.5 4.5a.75.75 0 0 1 0 1.33l-8.5 4.5a.75.75 0 0 1-.7 0l-8.5-4.5a.75.75 0 0 1 0-1.33l8.5-4.5ZM5.1 7.5 12 11.15 18.9 7.5 12 3.85 5.1 7.5Zm-2.25 4.15a.75.75 0 0 1 1.01-.31L12 15.65l8.14-4.31a.75.75 0 1 1 .7 1.32l-8.49 4.5a.75.75 0 0 1-.7 0l-8.5-4.5a.75.75 0 0 1-.3-1.01Zm0 4a.75.75 0 0 1 1.01-.31L12 19.65l8.14-4.31a.75.75 0 1 1 .7 1.32l-8.49 4.5a.75.75 0 0 1-.7 0l-8.5-4.5a.75.75 0 0 1-.3-1.01Z"
                  fill="currentColor"
                />
              </svg>
              <span class="menu-item-text" :class="sidebarToggle ? 'xl:hidden' : ''">Ringkasan Eksternal</span>
            </a>
          </li>

          <li>
            <a
              href="/compare"
              class="menu-item group"
              :class="page === 'compare' ? 'menu-item-active' : 'menu-item-inactive'"
            >
              <svg
                class="shrink-0"
                :class="page === 'compare' ? 'menu-item-icon-active' : 'menu-item-icon-inactive'"
                width="24" height="24" viewBox="0 0 24 24" fill="none"
              >
                <path
                  d="M4 20V10M9.33 20V4M14.67 20v-7M20 20V8"
                  stroke="currentColor" stroke-width="1.6" stroke-linecap="round"
                />
              </svg>
              <span class="menu-item-text" :class="sidebarToggle ? 'xl:hidden' : ''">Compare 2025</span>
            </a>
          </li>

          <li>
            <a
              href="/target"
              class="menu-item group"
              :class="page === 'target' ? 'menu-item-active' : 'menu-item-inactive'"
            >
              <svg
                class="shrink-0"
                :class="page === 'target' ? 'menu-item-icon-active' : 'menu-item-icon-inactive'"
                width="24" height="24" viewBox="0 0 24 24" fill="none"
              >
                <circle cx="12" cy="12" r="8.25" stroke="currentColor" stroke-width="1.5" />
                <circle cx="12" cy="12" r="4.25" stroke="currentColor" stroke-width="1.5" />
                <circle cx="12" cy="12" r="1.25" fill="currentColor" />
              </svg>
              <span class="menu-item-text" :class="sidebarToggle ? 'xl:hidden' : ''">Target 2026</span>
            </a>
          </li>
        </ul>
      </div>
    </nav>

    <!-- Kartu event -->
    <div
      class="mt-auto mb-6 rounded-2xl bg-gray-50 p-4 dark:bg-white/5"
      :class="sidebarToggle ? 'xl:hidden' : ''"
      x-show="app"
      x-cloak
    >
      <p class="text-theme-xs font-medium tracking-wide text-gray-400 uppercase">Event</p>
      <p class="mt-1.5 text-sm font-semibold text-gray-800 dark:text-white/90" x-text="eventLabel"></p>
      <p
        class="mt-1 text-xs leading-relaxed text-gray-500 dark:text-gray-400"
        x-text="app ? (app.uji ? 'Mode uji: ' + app.uji.warehouse : app.event.warehouse.join(' · ')) : ''"
      ></p>
    </div>
  </div>
</aside>
